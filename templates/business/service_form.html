{% extends "base.html" %}{% block title %}Service · {{ business.name }}{% endblock %}{% block content %}<section class="container py-5"><div class="form-shell"><span class="eyebrow">SERVICE</span><h1 class="page-title">{{ 'Edit service' if service else 'Create a service' }}</h1><form method="post" class="booking-panel"><label>Name<input name="name" value="{{ service.name if service else '' }}" class="form-control" required></label><label>Description<textarea name="description" class="form-control" rows="4">{{ service.description if service else '' }}</textarea></label><div class="row g-3"><div class="col-md-6"><label>Duration (minutes)<input type="number" name="duration" value="{{ service.duration if service else 30 }}" class="form-control" min="5" required></label></div><div class="col-md-6"><label>Price (R)<input type="number" name="price" value="{{ service.price if service else 0 }}" class="form-control" min="0" step="0.01"></label></div></div><div class="form-check"><input class="form-check-input" type="checkbox" name="popular" {% if service and service.popular %}checked{% endif %}><label class="form-check-label">Mark as popular</label></div>{% if service %}<div class="form-check"><input class="form-check-input" type="checkbox" name="active" {% if service.active %}checked{% endif %}><label class="form-check-label">Active and bookable</label></div>{% endif %}<button class="btn btn-primary btn-lg rounded-pill">Save service</button></form></div></section>{% endblock %}
