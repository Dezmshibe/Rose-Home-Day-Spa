{% extends "base.html" %}{% block title %}Create business · Appoint{% endblock %}{% block content %}<section class="container py-5"><div class="form-shell"><span class="eyebrow">BUSINESS ONBOARDING</span><h1 class="page-title">Create your business.</h1><p class="lead">Set up your public booking profile in a few minutes.</p><form method="post" class="booking-panel"><div class="row g-3"><div class="col-md-8"><label>Business name<input name="name" class="form-control" required></label></div><div class="col-md-4"><label>Category<select name="category" class="form-select">{% for c in categories %}<option>{{ c }}</option>{% endfor %}</select></label></div></div><label>Description<textarea name="description" class="form-control" rows="4"></textarea></label><div class="row g-3"><div class="col-md-6"><label>Email<input name="email" type="email" class="form-control"></label></div><div class="col-md-6"><label>Phone<input name="phone" class="form-control"></label></div><div class="col-md-8"><label>Address<input name="address" class="form-control"></label></div><div class="col-md-4"><label>City<input name="city" class="form-control"></label></div></div><button class="btn btn-primary btn-lg rounded-pill px-5">Launch business →</button></form></div></section>{% endblock %}
