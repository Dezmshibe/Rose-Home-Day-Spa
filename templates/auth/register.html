{% extends "base.html" %}
{% block title %}Create account · Londiieyy{% endblock %}
{% block content %}
<section class="auth-wrap">
  <div class="auth-card">
    <span class="eyebrow">JOIN US</span>
    <h1>Create your account.</h1>

    <form method="post">
      <label>Name
        <input name="name" class="form-control" required>
      </label>
      <label>Username
        <input name="username" class="form-control" required pattern="[A-Za-z0-9._-]{3,}"
               title="3+ characters: letters, numbers, dot, dash, underscore">
      </label>
      <label>Email <span class="text-muted">(optional)</span>
        <input type="email" name="email" class="form-control">
      </label>
      <label>Password
        <input type="password" name="password" class="form-control" minlength="6" required>
      </label>
      <label>Account type
        <select name="role" class="form-select">
          <option value="customer">I want to book appointments</option>
          <option value="business_owner">I own a business</option>
        </select>
      </label>
      <button class="btn btn-primary w-100 rounded-pill btn-lg">Create account</button>
    </form>

    <p class="text-center mt-4 mb-0">Already have an account? <a href="{{ url_for('login') }}">Login</a></p>
  </div>
</section>
{% endblock %}
